<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .game-container {
            display: flex;
            gap: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .main-game {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }

        canvas {
            background: #000;
            border: 3px solid #fff;
            display: block;
            image-rendering: pixelated;
        }

        .game-controls {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 5px;
            color: white;
            text-align: center;
        }

        .controls-text {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }

        button:hover {
            background: #764ba2;
        }

        button:active {
            transform: scale(0.98);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 150px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 5px;
            color: white;
        }

        .info-box h3 {
            margin-bottom: 10px;
            color: #ffd700;
        }

        .info-value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-align: center;
        }

        .next-piece {
            background: #000;
            border: 2px solid #667eea;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .next-canvas {
            display: block;
            image-rendering: pixelated;
        }

        .instruction {
            font-size: 12px;
            color: #ddd;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }

            .sidebar {
                flex-direction: row;
                min-width: auto;
                width: 100%;
                justify-content: space-around;
            }

            .info-box {
                flex: 1;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="main-game">
            <h1>TETRIS</h1>
            <canvas id="gameCanvas" width="200" height="400"></canvas>
            <div class="game-controls">
                <div class="controls-text">Use arrow keys or buttons to play</div>
                <div class="button-group">
                    <button id="leftBtn">← Left</button>
                    <button id="downBtn">↓ Down</button>
                    <button id="rightBtn">Right →</button>
                    <button id="rotateBtn">Rotate</button>
                </div>
                <div class="button-group">
                    <button id="startBtn">Start</button>
                    <button id="pauseBtn">Pause</button>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="info-box">
                <h3>Score</h3>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-box">
                <h3>Level</h3>
                <div class="info-value" id="level">1</div>
            </div>
            <div class="info-box">
                <h3>Lines</h3>
                <div class="info-value" id="lines">0</div>
            </div>
            <div class="info-box">
                <h3>Next</h3>
                <div class="next-piece">
                    <canvas id="nextCanvas" width="80" height="80"></canvas>
                </div>
            </div>
            <div class="info-box instruction">
                <strong>How to Play:</strong>
                <br>← → Move pieces
                <br>↓ Drop faster
                <br>↑ Rotate piece
                <br>Complete lines to score!
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        const GRID_WIDTH = 10;
        const GRID_HEIGHT = 20;
        const BLOCK_SIZE = canvas.width / GRID_WIDTH;

        // Tetris pieces
        const PIECES = [
            { shape: [[1, 1, 1, 1]], color: '#00ffff' }, // I
            { shape: [[1, 1], [1, 1]], color: '#ffff00' }, // O
            { shape: [[0, 1, 0], [1, 1, 1]], color: '#ff00ff' }, // T
            { shape: [[1, 0, 0], [1, 1, 1]], color: '#ff8800' }, // L
            { shape: [[0, 0, 1], [1, 1, 1]], color: '#0088ff' }, // J
            { shape: [[0, 1, 1], [1, 1, 0]], color: '#00ff00' }, // S
            { shape: [[1, 1, 0], [0, 1, 1]], color: '#ff0000' } // Z
        ];

        let grid = Array(GRID_HEIGHT).fill(null).map(() => Array(GRID_WIDTH).fill(0));
        let currentPiece = null;
        let currentX = 0;
        let currentY = 0;
        let nextPiece = null;
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameActive = false;
        let gamePaused = false;
        let dropCounter = 0;
        let dropInterval = 1000 - (level - 1) * 100;

        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('level');
        const linesDisplay = document.getElementById('lines');

        function getRandomPiece() {
            return JSON.parse(JSON.stringify(PIECES[Math.floor(Math.random() * PIECES.length)]));
        }

        function spawnPiece() {
            if (!nextPiece) nextPiece = getRandomPiece();
            currentPiece = nextPiece;
            nextPiece = getRandomPiece();
            currentX = Math.floor((GRID_WIDTH - currentPiece.shape[0].length) / 2);
            currentY = 0;

            if (!isValidMove(currentX, currentY)) {
                gameOver();
            }
        }

        function isValidMove(x, y, shape = currentPiece.shape) {
            for (let row = 0; row < shape.length; row++) {
                for (let col = 0; col < shape[row].length; col++) {
                    if (shape[row][col]) {
                        const newX = x + col;
                        const newY = y + row;

                        if (newX < 0 || newX >= GRID_WIDTH || newY >= GRID_HEIGHT) {
                            return false;
                        }

                        if (newY >= 0 && grid[newY][newX]) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function rotatePiece() {
            if (!currentPiece) return;
            const rotated = currentPiece.shape[0].map((_, i) =>
                currentPiece.shape.map(row => row[i]).reverse()
            );

            if (isValidMove(currentX, currentY, rotated)) {
                currentPiece.shape = rotated;
            }
        }

        function placePiece() {
            for (let row = 0; row < currentPiece.shape.length; row++) {
                for (let col = 0; col < currentPiece.shape[row].length; col++) {
                    if (currentPiece.shape[row][col]) {
                        const x = currentX + col;
                        const y = currentY + row;
                        if (y >= 0) grid[y][x] = currentPiece.color;
                    }
                }
            }
            clearLines();
            spawnPiece();
        }

        function clearLines() {
            let clearedLines = 0;
            for (let row = GRID_HEIGHT - 1; row >= 0; row--) {
                if (grid[row].every(cell => cell !== 0)) {
                    grid.splice(row, 1);
                    grid.unshift(Array(GRID_WIDTH).fill(0));
                    clearedLines++;
                    row++;
                }
            }

            if (clearedLines > 0) {
                lines += clearedLines;
                const points = [40, 100, 300, 1200];
                score += points[clearedLines - 1] * level;
                linesDisplay.textContent = lines;
                scoreDisplay.textContent = score;

                const newLevel = Math.floor(lines / 10) + 1;
                if (newLevel !== level) {
                    level = newLevel;
                    levelDisplay.textContent = level;
                    dropInterval = 1000 - (level - 1) * 100;
                }
            }
        }

        function update(deltaTime) {
            if (!gameActive || gamePaused || !currentPiece) return;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                if (isValidMove(currentX, currentY + 1)) {
                    currentY++;
                } else {
                    placePiece();
                }
                dropCounter = 0;
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_WIDTH; i++) {
                ctx.beginPath();
                ctx.moveTo(i * BLOCK_SIZE, 0);
                ctx.lineTo(i * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= GRID_HEIGHT; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * BLOCK_SIZE);
                ctx.lineTo(canvas.width, i * BLOCK_SIZE);
                ctx.stroke();
            }

            // Draw placed pieces
            for (let row = 0; row < GRID_HEIGHT; row++) {
                for (let col = 0; col < GRID_WIDTH; col++) {
                    if (grid[row][col]) {
                        ctx.fillStyle = grid[row][col];
                        ctx.fillRect(col * BLOCK_SIZE + 1, row * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                    }
                }
            }

            // Draw current piece
            if (currentPiece) {
                ctx.fillStyle = currentPiece.color;
                for (let row = 0; row < currentPiece.shape.length; row++) {
                    for (let col = 0; col < currentPiece.shape[row].length; col++) {
                        if (currentPiece.shape[row][col]) {
                            const x = currentX + col;
                            const y = currentY + row;
                            if (y >= 0) {
                                ctx.fillRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                            }
                        }
                    }
                }
            }

            // Draw pause overlay
            if (gamePaused && gameActive) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            }
        }

        function drawNextPiece() {
            nextCtx.fillStyle = '#000';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            if (nextPiece) {
                const blockSize = nextCanvas.width / 5;
                nextCtx.fillStyle = nextPiece.color;
                for (let row = 0; row < nextPiece.shape.length; row++) {
                    for (let col = 0; col < nextPiece.shape[row].length; col++) {
                        if (nextPiece.shape[row][col]) {
                            const x = col + (5 - nextPiece.shape[row].length) / 2;
                            const y = row + (5 - nextPiece.shape.length) / 2;
                            nextCtx.fillRect(x * blockSize + 1, y * blockSize + 1, blockSize - 2, blockSize - 2);
                        }
                    }
                }
            }
        }

        function gameOver() {
            gameActive = false;
            alert(`Game Over!\nScore: ${score}\nLines: ${lines}\nLevel: ${level}`);
            resetGame();
        }

        function resetGame() {
            grid = Array(GRID_HEIGHT).fill(null).map(() => Array(GRID_WIDTH).fill(0));
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 1000;
            scoreDisplay.textContent = score;
            levelDisplay.textContent = level;
            linesDisplay.textContent = lines;
            currentPiece = null;
            nextPiece = null;
            gamePaused = false;
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (!gameActive || gamePaused) return;
            if (e.key === 'ArrowLeft' && isValidMove(currentX - 1, currentY)) currentX--;
            if (e.key === 'ArrowRight' && isValidMove(currentX + 1, currentY)) currentX++;
            if (e.key === 'ArrowDown') {
                if (isValidMove(currentX, currentY + 1)) currentY++;
                else placePiece();
            }
            if (e.key === 'ArrowUp') rotatePiece();
            if (e.key === ' ') {
                gamePaused = !gamePaused;
                document.getElementById('pauseBtn').textContent = gamePaused ? 'Resume' : 'Pause';
            }
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            if (!gameActive) {
                resetGame();
                gameActive = true;
                gamePaused = false;
                spawnPiece();
                document.getElementById('startBtn').textContent = 'New Game';
                document.getElementById('pauseBtn').textContent = 'Pause';
            }
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            if (gameActive) {
                gamePaused = !gamePaused;
                document.getElementById('pauseBtn').textContent = gamePaused ? 'Resume' : 'Pause';
            }
        });

        document.getElementById('leftBtn').addEventListener('click', () => {
            if (gameActive && !gamePaused && isValidMove(currentX - 1, currentY)) currentX--;
        });

        document.getElementById('rightBtn').addEventListener('click', () => {
            if (gameActive && !gamePaused && isValidMove(currentX + 1, currentY)) currentX++;
        });

        document.getElementById('downBtn').addEventListener('click', () => {
            if (gameActive && !gamePaused) {
                if (isValidMove(currentX, currentY + 1)) currentY++;
                else placePiece();
            }
        });

        document.getElementById('rotateBtn').addEventListener('click', () => {
            if (gameActive && !gamePaused) rotatePiece();
        });

        // Game loop
        let lastTime = 0;
        function gameLoop(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            update(deltaTime);
            draw();
            drawNextPiece();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    <\/script>
</body>
</html>
