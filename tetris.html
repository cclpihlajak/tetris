<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; margin: auto; border: 1px solid #fff; }
    </style>
</head>
<body>
    <canvas id="tetris" width="240" height="400"></canvas>
    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');

        // Game settings
        const grid = 20;
        const rows = canvas.height / grid;
        const cols = canvas.width / grid;

        // Tetromino shapes
        const tetrominoes = [
            [[1, 1, 1, 1]], // I
            [[1, 1, 1], [0, 0, 1]], // J
            [[1, 1, 1], [1, 0, 0]], // L
            [[1, 1], [1, 1]], // O
            [[0, 1, 1], [1, 1, 0]], // S
            [[0, 1, 0], [1, 1, 1]], // T
            [[1, 1, 0], [0, 1, 1]], // Z
        ];

        let board = Array.from({ length: rows }, () => Array(cols).fill(0));
        let current

        // Game functions
        function draw() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c]) {
                        context.fillStyle = '#fff';
                        context.fillRect(c * grid, r * grid, grid - 1, grid - 1);
                    }
                }
            }
        }

        function createPiece(type) {
            return tetrominoes[type];
        }

        function placePiece(piece, offset) {
            piece.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value) {
                        board[r + offset.y][c + offset.x] = 1;
                    }
                });
            });
        }

        function collide(piece, offset) {
            for (let r = 0; r < piece.length; r++) {
                for (let c = 0; c < piece[r].length; c++) {
                    if (piece[r][c]) {
                        const x = c + offset.x;
                        const y = r + offset.y;
                        if (x < 0 || x >= cols || y >= rows || board[y][x]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function rotate(piece) {
            return piece[0].map((_, index) => piece.map(row => row[index]).reverse());
        }

        // Input handling
        document.addEventListener('keydown', (e) => {
            // Controls (assuming keys: ArrowLeft, ArrowRight, ArrowDown)
            if (e.key === 'ArrowLeft') move(-1);
            else if (e.key === 'ArrowRight') move(1);
            else if (e.key === 'ArrowDown') drop();
        });

        function move(dir) {
            if (!collide(current, { x: current.x + dir, y: current.y })) {
                current.x += dir;
            }
        }

        function drop() {
            if (!collide(current, { x: current.x, y: current.y + 1 })) {
                current.y += 1;
            } else {
                placePiece(current, current);
                // Check for complete lines and generate a new piece
                current = createPiece(Math.floor(Math.random() * tetrominoes.length));
            }
        }

        function update() {
            drop();
            draw();
        }

        // Start game loop
        current = createPiece(Math.floor(Math.random() * tetrominoes.length));
        setInterval(update, 1000);
    </script>
</body>
</html>
