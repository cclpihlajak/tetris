<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #000;
            color: white;
            font-family: Arial, sans-serif;
        }
        #tetris {
            width: 240px;
            height: 400px;
            border: 2px solid #fff;
            background-color: #000;
            position: relative;
        }
        .block {
            width: 20px;
            height: 20px;
            position: absolute;
            background-color: #fff;
        }
        #score {
            font-size: 24px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>Tetris Game</h1>
    <div id="tetris"></div>
    <div id="score">Score: 0</div>
    <script>
        const boardWidth = 10;
        const boardHeight = 20;
        const tetrisBoard = Array.from({ length: boardHeight }, () => Array(boardWidth).fill(0));

        const colors = ["", "red", "blue", "green", "cyan", "yellow", "magenta", "orange"];

        const pieces = [
            [[1, 1], [1, 1]], // Square
            [[0, 1, 0], [1, 1, 1]], // T-shape
            [[1, 1, 1, 1]], // Line
            [[1, 1, 0], [0, 1, 1]], // S-shape
            [[0, 1, 1], [1, 1, 0]], // Z-shape
            [[1, 1, 1], [1, 0, 0]], // L-shape
            [[1, 1, 1], [0, 0, 1]]  // J-shape
        ];

        let currentPiece;
        let currentPosition;
        let score = 0;
        let timer;

        function spawnPiece() {
            const random = Math.floor(Math.random() * pieces.length);
            currentPiece = pieces[random];
            currentPosition = { x: Math.floor(boardWidth / 2) - 1, y: 0 };

            if (collision() !== false) {
                clearInterval(timer);
                alert("Game Over");
            }
        }

        function collision(offset = { x: 0, y: 0 }) {
            for (let y = 0; y < currentPiece.length; y++) {
                for (let x = 0; x < currentPiece[0].length; x++) {
                    if (currentPiece[y][x]) {
                        const newX = x + currentPosition.x + offset.x;
                        const newY = y + currentPosition.y + offset.y;
                        if (newX < 0 || newX >= boardWidth || newY >= boardHeight || (newY >= 0 && tetrisBoard[newY][newX])) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function merge() {
            currentPiece.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        tetrisBoard[currentPosition.y + y][currentPosition.x + x] = value;
                    }
                });
            });
        }

        function clearLines() {
            tetrisBoard.forEach((row, index) => {
                if (row.every(cell => cell)) {
                    score += 100;
                    document.getElementById('score').innerText = `Score: ${score}`;
                    tetrisBoard.splice(index, 1);
                    tetrisBoard.unshift(Array(boardWidth).fill(0));
                }
            });
        }

        function draw() {
            const tetris = document.getElementById('tetris');
            tetris.innerHTML = '';
            tetrisBoard.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        const block = document.createElement('div');
                        block.className = 'block';
                        block.style.backgroundColor = colors[value];
                        block.style.left = x * 20 + 'px';
                        block.style.top = y * 20 + 'px';
                        tetris.appendChild(block);
                    }
                });
            });
            currentPiece.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        const block = document.createElement('div');
                        block.className = 'block';
                        block.style.backgroundColor = colors[value];
                        block.style.left = (currentPosition.x + x) * 20 + 'px';
                        block.style.top = (currentPosition.y + y) * 20 + 'px';
                        tetris.appendChild(block);
                    }
                });
            });
        }

        function movePiece(direction) {
            if (collision({ x: direction, y: 0 })) {
                currentPosition.x += direction;
            }
        }

        function rotatePiece() {
            const rotated = currentPiece[0].map((_, i) => currentPiece.map(row => row[i])).reverse();
            if (collision()) {
                currentPiece = rotated;
            }
        }

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowLeft': movePiece(-1); break;
                case 'ArrowRight': movePiece(1); break;
                case 'ArrowDown': currentPosition.y += 1; break;
                case 'ArrowUp': rotatePiece(); break;
            }
            if (collision({ x: 0, y: 1 })) {
                currentPosition.y += 1;
            } else {
                merge();
                clearLines();
                spawnPiece();
            }
            draw();
        });

        function gameLoop() {
            if (collision({ x: 0, y: 1 })) {
                currentPosition.y += 1;
            } else {
                merge();
                clearLines();
                spawnPiece();
            }
            draw();
        }

        timer = setInterval(gameLoop, 1000);
        spawnPiece();
        draw();
    </script>
</body>
</html>
